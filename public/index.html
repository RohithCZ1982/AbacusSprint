<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Abacus Mental Math Test</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

<!-- ── VIEW: Registration ──────────────────────────────────────────────── -->
<div id="view-register" class="view active">
  <div class="card register-card">
    <div class="logo">
      <svg width="56" height="56" viewBox="0 0 56 56" fill="none">
        <rect width="56" height="56" rx="12" fill="#3b82f6"/>
        <rect x="10" y="8"  width="36" height="40" rx="4" fill="#1e40af"/>
        <rect x="8"  y="25" width="40" height="6"  rx="3" fill="#93c5fd"/>
        <circle cx="20" cy="18" r="4" fill="#fbbf24"/>
        <circle cx="36" cy="18" r="4" fill="#fbbf24"/>
        <circle cx="20" cy="38" r="4" fill="#fbbf24"/>
        <circle cx="28" cy="38" r="4" fill="#fbbf24"/>
        <circle cx="36" cy="38" r="4" fill="#fbbf24"/>
      </svg>
    </div>
    <h1>Positive Big Friends</h1>
    <p class="subtitle">Abacus Mental Math Assessment</p>
    <div class="notice">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
      Review your answers carefully before submitting — you only have one chance and cannot make changes afterward.
    </div>
    <form id="register-form">
      <div class="form-group">
        <label for="email">Email address <span class="required">*</span></label>
        <input type="email" id="email" placeholder="your@email.com" required autocomplete="email" />
      </div>
      <div class="form-group">
        <label for="name">Name <span class="optional">(optional)</span></label>
        <input type="text" id="name" placeholder="Your full name" autocomplete="name" />
      </div>
      <button type="submit" class="btn-primary">Start Test →</button>
    </form>
    <p class="test-info">20 questions &nbsp;·&nbsp; 1 point each &nbsp;·&nbsp; No time limit</p>
  </div>
</div>

<!-- ── VIEW: Test ──────────────────────────────────────────────────────── -->
<div id="view-test" class="view">
  <header class="test-header">
    <div class="test-title">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
      Abacus Test
    </div>
    <div class="timer" id="timer">00:00</div>
    <div class="progress-label" id="progress-label">Question 1 / 20</div>
  </header>

  <div class="progress-bar-wrap">
    <div class="progress-bar-fill" id="progress-bar"></div>
  </div>

  <main class="test-body">
    <div id="question-area"></div>

    <div class="nav-row">
      <button class="btn-secondary" id="btn-prev" disabled>← Previous</button>
      <div class="dot-nav" id="dot-nav"></div>
      <button class="btn-primary"  id="btn-next">Next →</button>
    </div>

    <div id="submit-row" class="hidden">
      <button class="btn-submit" id="btn-submit">Submit Test</button>
    </div>
  </main>
</div>

<!-- ── VIEW: Results ──────────────────────────────────────────────────── -->
<div id="view-result" class="view">
  <div class="card result-card">
    <div id="result-icon" class="result-icon"></div>
    <h2 id="result-heading"></h2>
    <div class="score-circle">
      <svg class="score-ring" viewBox="0 0 120 120">
        <circle cx="60" cy="60" r="52" fill="none" stroke="#e2e8f0" stroke-width="10"/>
        <circle cx="60" cy="60" r="52" fill="none" stroke="#3b82f6" stroke-width="10"
                stroke-linecap="round" stroke-dasharray="326.73"
                stroke-dashoffset="326.73" id="score-ring-fill"
                transform="rotate(-90 60 60)"/>
      </svg>
      <div class="score-text">
        <span id="score-num" class="score-num"></span>
        <span id="score-den" class="score-den"></span>
      </div>
    </div>
    <p id="result-subtitle"></p>

    <div class="answer-review" id="answer-review"></div>

    <div class="result-actions">
      <button class="btn-secondary" id="btn-retake">Take Another Test</button>
    </div>
    <p class="submission-id" id="submission-id"></p>
  </div>
</div>

<!-- ── VIEW: Submitting spinner ────────────────────────────────────────── -->
<div id="view-submitting" class="view">
  <div class="spinner-wrap">
    <div class="spinner"></div>
    <p>Submitting your answers…</p>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
